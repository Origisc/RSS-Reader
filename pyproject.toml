[project]
name = "rss-reader"
version = "1.0.3"
description = "A local-first, cross-platform RSS reader with optional AI tools"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "feedparser>=6.0.12",
    "pyside6>=6.11.1",
    "requests>=2.34.2",
]

[project.scripts]
mercury = "mercury.main:main"

[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = [".", "src"]
include = ["core*", "domain*", "mercury*"]
namespaces = false

[dependency-groups]
dev = [
    "pyinstaller==6.21.0",
    "pytest>=9.1.1",
]

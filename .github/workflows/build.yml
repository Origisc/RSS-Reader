name: Cross-Platform Build and Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows x64
            executable_name: Mercury-Windows-x64
            artifact_name: Mercury-Windows-x64
            artifact_path: dist/Mercury-Windows-x64.exe
          - os: macos-latest
            platform: macOS
            executable_name: Mercury
            artifact_name: Mercury-macOS
            artifact_path: dist/Mercury-macOS.dmg
          - os: ubuntu-latest
            platform: Linux x64
            executable_name: Mercury-Linux-x64
            artifact_name: Mercury-Linux-x64
            artifact_path: dist/Mercury-Linux-x64

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install uv and Python 3.13
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install locked application dependencies
        run: uv sync --locked

      - name: Install Linux GUI runtime library
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1

      - name: Run offline tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run --no-sync pytest -q

      - name: Build standalone application
        run: >-
          uv run --no-sync python -m PyInstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --name "${{ matrix.executable_name }}"
          --paths src
          --paths .
          main.py

      - name: Create macOS disk image
        if: runner.os == 'macOS'
        run: >-
          hdiutil create
          -volname Mercury
          -srcfolder dist/Mercury.app
          -ov
          -format UDZO
          dist/Mercury-macOS.dmg

      - name: Upload downloadable build
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

      - name: Attach build to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_path }}
